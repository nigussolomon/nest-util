name: Publish Libs

on:
  push:
    branches: [publish]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nest-audit:
    name: Build & Verify nest-audit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test @nest-util/nest-audit
        run: pnpm nx test @nest-util/nest-audit

      - name: Build @nest-util/nest-audit
        run: pnpm nx build @nest-util/nest-audit

      - id: extract-version
        name: Extract package version
        run: echo "version=$(jq -r .version libs/nest-audit/package.json)" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          cp libs/nest-audit/package.json libs/nest-audit/dist/package.json
          cd libs/nest-audit/dist
          jq '(.main, .module, .types, .exports["."].types, .exports["."].import, .exports["."].default) |= sub("^\\./dist/"; "./") | del(.files) | del(.exports["."]["@nest-util/source"])' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm pack --pack-destination ../../../
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-audit-tgz
          path: nest-util-nest-audit-*.tgz
          retention-days: 7

  nest-crud:
    name: Build & Verify nest-crud
    needs: nest-audit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test @nest-util/nest-crud
        run: pnpm nx test @nest-util/nest-crud

      - name: Build @nest-util/nest-crud
        run: pnpm nx build @nest-util/nest-crud

      - name: Download nest-audit artifact
        uses: actions/download-artifact@v4
        with:
          name: nest-audit-tgz
          path: ./artifacts

      - name: Validate nest-audit artifact exists
        run: ls -1 ./artifacts/nest-util-nest-audit-*.tgz

      - id: extract-version
        name: Extract package version
        run: echo "version=$(jq -r .version libs/nest-crud/package.json)" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          AUDIT_VER="${{ needs.nest-audit.outputs.version }}"
          AUDIT_URL="https://github.com/${{ github.repository }}/releases/download/nest-audit@${AUDIT_VER}/nest-util-nest-audit-${AUDIT_VER}.tgz"
          echo "nest-audit peerDependency URL: ${AUDIT_URL}"
          cp libs/nest-crud/package.json libs/nest-crud/dist/package.json
          cd libs/nest-crud/dist
          jq --arg url "${AUDIT_URL}" '(.main, .module, .types, .exports["."].types, .exports["."].import, .exports["."].default) |= sub("^\\./dist/"; "./") | .peerDependencies["@nest-util/nest-audit"] = $url | del(.files) | del(.exports["."]["@nest-util/source"])' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm pack --pack-destination ../../../
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-crud-tgz
          path: nest-util-nest-crud-*.tgz
          retention-days: 7

  ncnu:
    name: Build & Verify ncnu
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build ncnu
        run: pnpm nx build ncnu

      - id: extract-version
        name: Extract package version
        run: echo "version=$(jq -r .version libs/ncnu/package.json)" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          mkdir -p dist/libs/ncnu/bin
          cp libs/ncnu/package.json dist/libs/ncnu/package.json
          cp libs/ncnu/bin/ncnu.js dist/libs/ncnu/bin/ncnu.js
          cd dist/libs/ncnu
          jq '.main |= sub("\\.ts$"; ".js") | del(.devDependencies)' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm pack --pack-destination ../../../
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncnu-tgz
          path: ncnu-*.tgz
          retention-days: 7

  nest-auth:
    name: Build & Verify nest-auth
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test @nest-util/nest-auth
        run: pnpm nx test @nest-util/nest-auth

      - name: Build @nest-util/nest-auth
        run: pnpm nx build @nest-util/nest-auth

      - id: extract-version
        name: Extract package version
        run: echo "version=$(jq -r .version libs/nest-auth/package.json)" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          cp libs/nest-auth/package.json libs/nest-auth/dist/package.json
          cd libs/nest-auth/dist
          jq '(.main, .module, .types, .exports["."].types, .exports["."].import, .exports["."].default) |= sub("^\\./dist/"; "./") | del(.files) | del(.exports["."]["@nest-util/source"])' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm pack --pack-destination ../../../
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-auth-tgz
          path: nest-util-nest-auth-*.tgz
          retention-days: 7

  nest-file:
    name: Build & Verify nest-file
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test @nest-util/nest-file
        run: pnpm nx test @nest-util/nest-file

      - name: Build @nest-util/nest-file
        run: pnpm nx build @nest-util/nest-file

      - id: extract-version
        name: Extract package version
        run: echo "version=$(jq -r .version libs/nest-file/package.json)" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          cp libs/nest-file/package.json libs/nest-file/dist/package.json
          cd libs/nest-file/dist
          jq '(.main, .module, .types, .exports["."].types, .exports["."].import, .exports["."].default) |= sub("^\\./dist/"; "./") | del(.files) | del(.exports["."]["@nest-util/source"])' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm pack --pack-destination ../../../
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-file-tgz
          path: nest-util-nest-file-*.tgz
          retention-days: 7

  release:
    name: Publish versioned releases
    runs-on: ubuntu-latest
    needs:
      - nest-audit
      - nest-crud
      - ncnu
      - nest-auth
      - nest-file
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-tgz'
          path: ./release-artifacts
          merge-multiple: true

      - name: Publish nest-audit release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nest-audit@${{ needs.nest-audit.outputs.version }}
          files: release-artifacts/nest-util-nest-audit-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nest-crud release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nest-crud@${{ needs.nest-crud.outputs.version }}
          files: release-artifacts/nest-util-nest-crud-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ncnu release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ncnu@${{ needs.ncnu.outputs.version }}
          files: release-artifacts/ncnu-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nest-auth release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nest-auth@${{ needs.nest-auth.outputs.version }}
          files: release-artifacts/nest-util-nest-auth-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nest-file release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nest-file@${{ needs.nest-file.outputs.version }}
          files: release-artifacts/nest-util-nest-file-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish combined latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: |
            release-artifacts/nest-util-nest-audit-*.tgz
            release-artifacts/nest-util-nest-crud-*.tgz
            release-artifacts/ncnu-*.tgz
            release-artifacts/nest-util-nest-auth-*.tgz
            release-artifacts/nest-util-nest-file-*.tgz
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
