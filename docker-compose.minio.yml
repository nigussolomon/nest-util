services:
  minio:
    image: minio/minio:latest
    container_name: demo_minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - demo_minio_data:/data

volumes:
  demo_minio_data:
